<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeno — Présentation</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{--cyan:#2fb6ff;--ink:#fff;--mut:rgba(255,255,255,.62)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#06142b}
body{font-family:'JetBrains Mono',monospace;color:var(--ink);
 background:linear-gradient(180deg,#0a2347 0%,#0b1a33 38%,#1b1216 78%,#2a1710 100%)}
.slide{position:relative;width:100%;height:100%;overflow:hidden}
.glow{position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(40% 50% at 52% 45%,rgba(47,182,255,.22),transparent 70%),
 radial-gradient(35% 30% at 85% 100%,rgba(255,140,66,.10),transparent 70%)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;z-index:2}

/* top bar */
header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:34px 6vw}
.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:300;letter-spacing:.08em}
.brand svg{width:34px;height:34px}
.pill{border:1px solid rgba(255,255,255,.7);border-radius:30px;padding:10px 22px;font-size:11.5px;letter-spacing:.14em;font-weight:300;
 background:rgba(255,255,255,.03);backdrop-filter:blur(6px)}
.burger{width:34px;display:grid;gap:7px;justify-items:end}
.burger i{display:block;height:1.5px;background:#fff}.burger i:nth-child(1){width:34px}.burger i:nth-child(2){width:24px}.burger i:nth-child(3){width:34px}

/* giant name (behind the 3D object) */
.giant{position:absolute;z-index:1;top:15vh;left:0;right:0;display:flex;justify-content:center;gap:2.2vw;
 font-weight:100;font-size:min(30vh,19vw);line-height:1;letter-spacing:.02em;will-change:transform}
.giant span{display:inline-block;opacity:0;transform:translateY(-60px) rotateX(70deg);animation:drop 1.1s cubic-bezier(.2,.8,.2,1) forwards;
 -webkit-text-stroke:0;text-shadow:0 0 40px rgba(47,182,255,.25)}
.giant span:nth-child(1){animation-delay:.2s}.giant span:nth-child(2){animation-delay:.35s}
.giant span:nth-child(3){animation-delay:.5s}.giant span:nth-child(4){animation-delay:.65s}
@keyframes drop{to{opacity:1;transform:none}}
.vtag{position:absolute;z-index:3;left:calc(50% - min(33vw,470px));top:23vh;writing-mode:vertical-rl;transform:rotate(180deg);
 font-size:11px;letter-spacing:.2em;color:var(--mut);font-weight:300}

/* left copy */
.left{position:absolute;z-index:4;left:6vw;bottom:9vh;max-width:min(44vw,520px)}
.left h1{font-weight:400;font-size:clamp(20px,2.7vw,36px);line-height:1.22;letter-spacing:.03em;text-transform:uppercase;text-align:right}
.left h1 .l{display:block;overflow:hidden}
.left h1 .l b{display:block;font-weight:400;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.left h1 .l:nth-child(1) b{animation-delay:.9s}.left h1 .l:nth-child(2) b{animation-delay:1s}
.left h1 .l:nth-child(3) b{animation-delay:1.1s}.left h1 .l:nth-child(4) b{animation-delay:1.2s}
.left h1 .c{color:var(--cyan);text-shadow:0 0 24px rgba(47,182,255,.5)}
@keyframes up{to{transform:none}}
.place{margin-top:3vh;text-align:right;opacity:0;animation:fade 1s 1.5s forwards}
.place big{display:block;font-weight:200;font-size:clamp(34px,5.4vw,76px);letter-spacing:.02em;line-height:1}
.place small{display:block;margin-top:8px;font-size:12px;letter-spacing:.2em;color:var(--mut);font-weight:300}
@keyframes fade{to{opacity:1}}

/* glass card (carousel) */
.card{position:absolute;z-index:4;right:6vw;bottom:19vh;width:min(25vw,310px);min-height:150px;padding:22px 22px 18px;border-radius:14px;
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);
 opacity:0;transform:translateX(30px);animation:in .9s 1.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
.card .k{font-size:10.5px;letter-spacing:.18em;color:var(--cyan);margin-bottom:10px;font-weight:600;text-transform:uppercase}
.card p{font-size:12.5px;line-height:1.7;font-weight:300;color:rgba(255,255,255,.9);min-height:105px;transition:opacity .3s}
.card .nav{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.dots{display:flex;gap:5px}.dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.3);transition:.3s}.dots i.on{background:#fff;width:14px;border-radius:3px}
.arrows{display:flex;gap:10px}
.arrows button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:none;color:#fff;cursor:pointer;font-family:inherit;font-size:12px;transition:.2s}
.arrows button:hover{background:#fff;color:#06142b}
.arrows button:focus-visible,.pill:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* platforms */
.plats{position:absolute;z-index:4;right:6vw;bottom:7vh;display:flex;align-items:center;gap:18px;opacity:0;animation:fade 1s 1.7s forwards}
.plats span.t{font-size:10.5px;letter-spacing:.14em;line-height:1.6;color:#fff;font-weight:300;max-width:130px}
.plats .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;
 background:radial-gradient(circle at 30% 25%,#e8f4ff,#5b7ea3 55%,#16263c);color:#06142b;box-shadow:0 0 16px rgba(47,182,255,.35);transition:transform .25s}
.plats .ic:hover{transform:translateY(-4px) scale(1.1)}
.plats .ic:nth-of-type(2){background:radial-gradient(circle at 30% 25%,#fff0d6,#c9a84c 55%,#3b2c10)}
.plats .ic:nth-of-type(3){background:radial-gradient(circle at 30% 25%,#e7e1ff,#7b61ff 55%,#1a1240)}

@media(max-width:820px){
 .vtag{display:none}.giant{top:12vh;font-size:21vw}
 .left{left:6vw;right:6vw;max-width:none;bottom:34vh}.left h1,.place{text-align:left}
 .card{left:6vw;right:6vw;width:auto;bottom:11vh}.plats{left:6vw;right:auto;bottom:3vh}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="slide" id="slide">
 <div class="glow"></div>

 <header>
  <div class="brand">
   <!-- Logo Zeno : emblème circulaire + Z -->
   <svg viewBox="0 0 40 40" aria-hidden="true">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fb6ff"/><stop offset="1" stop-color="#7b61ff"/></linearGradient></defs>
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#lg)" stroke-width="1.6"/>
    <path d="M3.5 24c3 3 5 3 8 0s5-3 8 0 5 3 8 0 5-3 8 0" fill="none" stroke="url(#lg)" stroke-width="1" opacity=".55"/>
    <path d="M12 12h16L12 28h16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
   </svg>
   <span>Zeno</span>
  </div>
  <div class="pill" tabindex="0">IMAGINEZ. CRÉEZ. DÉVELOPPEZ.</div>
  <div class="burger" aria-hidden="true"><i></i><i></i><i></i></div>
 </header>

 <div class="giant" id="giant" aria-label="ZENO"><span>Z</span><span>E</span><span>N</span><span>O</span></div>
 <div class="vtag">PLATEFORME SAAS · IA</div>

 <canvas id="gl"></canvas>

 <section class="left">
  <h1>
   <span class="l"><b>Créez votre</b></span>
   <span class="l"><b class="c">influenceur virtuel IA</b></span>
   <span class="l"><b>et publiez vos vidéos</b></span>
   <span class="l"><b>automatiquement</b></span>
  </h1>
  <div class="place"><big>Tahiti</big><small>POLYNÉSIE FRANÇAISE</small></div>
 </section>

 <aside class="card" aria-live="polite">
  <div class="k" id="ck">Le projet</div>
  <p id="cp"></p>
  <div class="nav">
   <div class="dots" id="dots"><i></i><i></i><i></i></div>
   <div class="arrows"><button id="prev" aria-label="Précédent">‹</button><button id="next" aria-label="Suivant">›</button></div>
  </div>
 </aside>

 <div class="plats">
  <span class="t">PUBLICATION AUTOMATIQUE SUR</span>
  <div class="ic" title="TikTok">Tk</div><div class="ic" title="Instagram">Ig</div><div class="ic" title="YouTube Shorts">Yt</div>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== Carte carrousel ===== */
var slides=[
 {k:'Le projet',t:"Zeno transforme vos idées en vidéos publicitaires automatiques pour libérer votre temps et attirer vos futurs clients."},
 {k:'Pour qui',t:"Restaurants, pensions de famille, hôtels, prestataires et solopreneurs de Polynésie, sans avoir à se filmer ni savoir monter."},
 {k:'Comment',t:"Visage, nom et voix de l'influenceur choisis une fois, puis vidéos générées et programmées sur TikTok, Instagram et YouTube."}
];
var idx=0,cp=document.getElementById('cp'),ck=document.getElementById('ck'),dots=document.querySelectorAll('#dots i');
function show(i){
 idx=(i+slides.length)%slides.length;cp.style.opacity=0;
 setTimeout(function(){ck.textContent=slides[idx].k;cp.textContent=slides[idx].t;cp.style.opacity=1;
  dots.forEach(function(d,n){d.classList.toggle('on',n===idx)})},250);
}
document.getElementById('next').onclick=function(){show(idx+1)};
document.getElementById('prev').onclick=function(){show(idx-1)};
cp.textContent=slides[0].t;dots[0].classList.add('on');

/* ===== Scène 3D : noyau IA ===== */
var cv=document.getElementById('gl'),R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
var S=new THREE.Scene(),C=new THREE.PerspectiveCamera(45,1,.1,100);C.position.z=7;
var G=new THREE.Group();S.add(G);

var core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15,3),
 new THREE.MeshBasicMaterial({color:0x0f5fa8,transparent:true,opacity:.55}));
G.add(core);
var wire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.7,2),
 new THREE.MeshBasicMaterial({color:0x2fb6ff,wireframe:true,transparent:true,opacity:.55}));
G.add(wire);
var shell=new THREE.Mesh(new THREE.IcosahedronGeometry(2.25,1),
 new THREE.MeshBasicMaterial({color:0x7b61ff,wireframe:true,transparent:true,opacity:.22}));
G.add(shell);
var rings=[];
[2.7,3.1].forEach(function(r,i){
 var m=new THREE.Mesh(new THREE.TorusGeometry(r,.012,8,160),new THREE.MeshBasicMaterial({color:i?0x7b61ff:0x2fb6ff,transparent:true,opacity:.7}));
 m.rotation.x=1.2+i*.5;m.rotation.y=i*.6;G.add(m);rings.push(m);
});
/* particules */
var N=700,pos=new Float32Array(N*3);
for(var i=0;i<N;i++){var r=3+Math.random()*3.5,a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);
 pos[i*3]=r*Math.sin(b)*Math.cos(a);pos[i*3+1]=r*Math.sin(b)*Math.sin(a);pos[i*3+2]=r*Math.cos(b);}
var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
var pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x9fdcff,size:.035,transparent:true,opacity:.8}));S.add(pts);

function resize(){var w=innerWidth,h=innerHeight;R.setSize(w,h,false);C.aspect=w/h;
 C.position.z=w<820?10:7;C.updateProjectionMatrix();
 G.position.set(w<820?0:.15,w<820?1.3:-.15,0);}
addEventListener('resize',resize);resize();

var mx=0,my=0,tx=0,ty=0,giant=document.getElementById('giant');
addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
var t0=performance.now(),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function loop(){
 var t=(performance.now()-t0)/1000,intro=Math.min(1,t/1.6),e=1-Math.pow(1-intro,3);
 tx+=(mx-tx)*.05;ty+=(my-ty)*.05;
 G.scale.setScalar(.2+.8*e);
 G.rotation.y=(still?0:t*.18)+tx*1.1;G.rotation.x=ty*.7;
 wire.rotation.y=-t*.25;shell.rotation.x=t*.12;
 rings[0].rotation.z=t*.35;rings[1].rotation.z=-t*.28;
 core.scale.setScalar(1+Math.sin(t*2)*.04);
 pts.rotation.y=t*.03;
 giant.style.transform='translate('+(-tx*26)+'px,'+(-ty*16)+'px)';
 R.render(S,C);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
